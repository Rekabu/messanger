<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#000;color:#eee;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(360px,92vw);background:#0b0b0b;border:1px solid #1c1c1c;border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 4px;font-size:22px}
form{display:flex;flex-direction:column;gap:12px}
input{font:inherit;color:inherit;padding:11px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#000;outline:none}
input:focus{border-color:#555}
button{font:inherit;padding:11px;border:0;border-radius:10px;background:#2b6cd4;color:#fff;cursor:pointer}
button:hover{background:#3a7be6}
.flash{padding:10px 12px;border-radius:8px;background:#3a1518;color:#ffb3b3;font-size:13px}
.alt{text-align:center;color:#8a94a6}
a{color:#7ab7ff;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>Вход</h1>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}

  <form method="post" action="/login">
    <input type="text" name="username" placeholder="Имя пользователя" autocomplete="username" required autofocus>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>

  <div class="alt">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
</div>
</body>
</html>
