<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — Мессенджер</title>
<style>
    :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --border: #2a2f3a;
        --text: #e7e9ee;
        --text-dim: #8b93a3;
        --accent: #4f8cff;
        --error: #ff5f6b;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
        width: 320px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
    }
    h1 {
        font-size: 20px;
        margin: 0 0 20px;
    }
    label {
        display: block;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 6px;
    }
    input {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        cursor: pointer;
    }
    .switch {
        margin-top: 16px;
        font-size: 13px;
        color: var(--text-dim);
        text-align: center;
    }
    .switch a { color: var(--accent); text-decoration: none; }
    .flash {
        background: rgba(255, 95, 107, 0.12);
        border: 1px solid var(--error);
        color: var(--error);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
    }
</style>
</head>
<body>
<div class="card">
    <h1>Регистрация</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for m in messages %}
                <div class="flash">{{ m }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <div style="font-size:12px;color:var(--text-dim);margin:-12px 0 16px;">Минимум 6 символов</div>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="switch">
        Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
    </div>
</div>
</body>
</html>
