<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат</title>
<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --panel-2:#151515;
  --border:#1c1c1c;
  --border-2:#2a2a2a;
  --text:#eee;
  --text-dim:#8a94a6;
  --text-mute:#7d7d7d;
  --hover:#151515;
  --active:#222;
  --mine:#2b4c7e;
  --theirs:#1c1c1e;
  --accent:#2b6cd4;
  --accent-hover:#3a7be6;
  --dot-off:#555;
  --dot-on:#22c55e;
  --input-bg:transparent;
  --modal-bg:#151515;
  --card-bg:#0b0b0b;
  --badge:#2b6cd4;
  --danger:#f66;
  --link:#7ab7ff;
  --toast:#333;
  --scroll:#333;
}
/* Светлая */
html[data-theme="light"]{
  --bg:#ffffff;
  --panel:#f5f6f8;
  --panel-2:#eceef2;
  --border:#dfe2e8;
  --border-2:#cfd3db;
  --text:#1a1d23;
  --text-dim:#5b6472;
  --text-mute:#8b93a3;
  --hover:#e9ecf1;
  --active:#dde2ea;
  --mine:#cfe2ff;
  --theirs:#eef1f5;
  --accent:#2b6cd4;
  --accent-hover:#1f5cbe;
  --dot-off:#b8bec9;
  --dot-on:#22c55e;
  --input-bg:#ffffff;
  --modal-bg:#ffffff;
  --card-bg:#ffffff;
  --badge:#2b6cd4;
  --danger:#d33;
  --link:#1f5cbe;
  --toast:#333;
  --scroll:#c8ccd4;
}
html[data-theme="light"] .msg.mine{color:#0b1a33}
html[data-theme="light"] .msg.mine .meta{color:#3a4a63}
html[data-theme="light"] .msg .author{color:#1f5cbe}
html[data-theme="light"] #send{color:#fff}

/* Серая */
html[data-theme="gray"]{
  --bg:#2b2d31;
  --panel:#232428;
  --panel-2:#2f3136;
  --border:#1e1f22;
  --border-2:#3a3c42;
  --text:#e6e7ea;
  --text-dim:#a3a6ad;
  --text-mute:#8a8d94;
  --hover:#33353a;
  --active:#3d4046;
  --mine:#4a5a7a;
  --theirs:#3a3c42;
  --accent:#4f7fd6;
  --accent-hover:#5f8fe6;
  --dot-off:#6b6e75;
  --dot-on:#22c55e;
  --input-bg:#2f3136;
  --modal-bg:#2b2d31;
  --card-bg:#232428;
  --badge:#4f7fd6;
  --danger:#f66;
  --link:#8fb8ff;
  --toast:#1e1f22;
  --scroll:#4a4c52;
}

/* Синяя */
html[data-theme="blue"]{
  --bg:#0d1b2e;
  --panel:#102542;
  --panel-2:#16304f;
  --border:#0a1728;
  --border-2:#1d3d63;
  --text:#e6f0ff;
  --text-dim:#9db8d9;
  --text-mute:#7f9bc0;
  --hover:#16304f;
  --active:#1d3d63;
  --mine:#2b5fa8;
  --theirs:#1a3557;
  --accent:#3b82f6;
  --accent-hover:#4f92ff;
  --dot-off:#4a6a93;
  --dot-on:#22c55e;
  --input-bg:#16304f;
  --modal-bg:#102542;
  --card-bg:#0d1b2e;
  --badge:#3b82f6;
  --danger:#ff7a7a;
  --link:#8fc0ff;
  --toast:#0a1728;
  --scroll:#1d3d63;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:var(--link)}

#sidebar{width:262px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);padding:18px 18px 14px}
.me{padding-bottom:14px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:13px}
.me b{color:var(--text);font-weight:600}
.me a{display:inline-block;margin-top:8px;color:var(--text-dim);text-decoration:none}
.me a:hover{color:var(--text)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot-off);flex:none}
.dot.on{background:var(--dot-on)}
#lists{flex:1;overflow-y:auto;margin:0 -8px;padding:0 8px}
.label{margin:16px 0 6px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.empty{margin:0 12px;color:var(--text-mute);font-size:12px}
.item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--hover)}
.item.on{background:var(--active)}
.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .hash{color:var(--text-mute);width:9px;text-align:center}
.badge{font-style:normal;background:var(--badge);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.x{display:none;background:none;color:var(--text-mute);padding:0 2px}
.item:hover .x{display:block}
.x:hover{color:var(--danger)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.round{width:50px;height:50px;border-radius:50%;background:var(--panel-2);color:var(--text);font-size:28px;line-height:1}
.round:hover,.wide:hover{background:var(--active)}
.wide{width:100%;padding:10px;border-radius:8px;background:var(--panel-2);color:var(--text)}

#chat{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
#title{font-size:18px;font-weight:700}
#sub{font-size:12px;color:var(--text-dim);min-height:16px}
#back{display:none;background:none;font-size:22px}
#messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.msg{position:relative;max-width:75%;padding:7px 11px;border-radius:12px;background:var(--theirs);align-self:flex-start;word-break:break-word}
.msg.mine{background:var(--mine);align-self:flex-end}
.msg .author{font-size:12px;color:var(--link);margin-bottom:2px}
.msg .text{white-space:pre-wrap}
.msg img,.msg video{display:block;max-width:100%;max-height:320px;border-radius:8px;margin-bottom:4px}
.msg audio{display:block;max-width:100%;margin-bottom:4px}
.meta{font-size:11px;color:var(--text-dim);text-align:right;margin-top:2px}
.tick.read{color:#6fd6ff}
.actions{display:none;position:absolute;top:-14px;right:6px;gap:2px;background:var(--active);border-radius:8px;padding:2px}
.msg:hover .actions{display:flex}
.actions button{background:none;padding:2px 6px}
.hint{margin:auto;color:var(--text-mute)}
#editbar{padding:6px 20px;background:var(--panel-2);color:var(--text-dim);font-size:12px;display:flex;justify-content:space-between}
#editbar button{background:none;color:var(--text-dim)}
footer{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--border);background:var(--panel)}
footer .ic{background:none;font-size:20px;padding:4px 8px;opacity:.8}
footer .ic:hover{opacity:1}
footer .ic.rec{color:#f33;opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
#text{flex:1;min-width:0;padding:10px 16px;border-radius:20px;border:1px solid var(--border-2);background:var(--input-bg);outline:none}
#text:focus{border-color:var(--accent)}
#send{padding:10px 18px;border-radius:20px;background:var(--accent);color:#fff}
#send:hover{background:var(--accent-hover)}
#send:disabled,#text:disabled{opacity:.4;cursor:default}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10}
.card{width:min(360px,92vw);background:var(--modal-bg);border:1px solid var(--border-2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card input[type=text],.card input:not([type]){padding:10px 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--card-bg);outline:none}
.card form{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px;border-radius:8px;background:var(--panel-2);color:var(--text-dim)}
.tabs button.on{background:var(--active);color:var(--text)}
.primary{padding:10px;border-radius:8px;background:var(--accent);color:#fff}
.primary:hover{background:var(--accent-hover)}
.close{background:none;color:var(--text-dim);padding:6px}
.row{display:flex;align-items:center;gap:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}

/* селектор темы */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--text-dim)}
.theme-opt .swatch{width:100%;height:34px;border-radius:8px;border:2px solid transparent;box-sizing:border-box}
.theme-opt.on .swatch{border-color:var(--accent)}
.theme-opt.on{color:var(--text)}
.swatch.black{background:linear-gradient(135deg,#000 60%,#1c1c1e 60%)}
.swatch.light{background:linear-gradient(135deg,#ffffff 60%,#eef1f5 60%)}
.swatch.gray{background:linear-gradient(135deg,#2b2d31 60%,#3a3c42 60%)}
.swatch.blue{background:linear-gradient(135deg,#0d1b2e 60%,#16304f 60%)}

@media(max-width:700px){
  #sidebar{width:100%;border-right:0}
  #chat{display:none}
  body.chat-open #sidebar{display:none}
  body.chat-open #chat{display:flex}
  #back{display:block}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="me">
    <div>Вы вошли как <b>{{ username }}</b> <i id="meDot" class="dot"></i></div>
    <a href="/logout" id="logout">Выйти</a>
  </div>
  <div id="lists">
    <div class="label">Группы</div><div id="groups"></div>
    <div class="label">Личные</div><div id="personal"></div>
  </div>
  <div class="bottom">
    <button id="addBtn" class="round" title="Новый чат или группа">+</button>
    <button id="settingsBtn" class="wide">⚙ Настройки</button>
  </div>
</aside>

<main id="chat">
  <header>
    <button id="back" title="Назад">←</button>
    <div><div id="title">Выберите чат</div><div id="sub"></div></div>
  </header>
  <div id="messages"></div>
  <div id="editbar" hidden><span>Редактирование сообщения</span><button id="cancelEdit">✕</button></div>
  <footer>
    <button id="attachBtn" class="ic" title="Прикрепить файл">📎</button>
    <input type="file" id="file" hidden>
    <button id="micBtn" class="ic" title="Голосовое сообщение">🎤</button>
    <input id="text" placeholder="Написать сообщение..." autocomplete="off" disabled>
    <button id="send" disabled>Отправить</button>
  </footer>
</main>

<div id="addModal" class="overlay" hidden>
  <div class="card">
    <div class="tabs"><button data-tab="p" class="on">Личный чат</button><button data-tab="g">Группа</button></div>
    <div id="tab-p" class="card" style="padding:0;border:0;background:none">
      <input id="peer" placeholder="Имя пользователя" autocomplete="off">
      <button id="addPeer" class="primary">Добавить</button>
    </div>
    <form id="tab-g" method="post" action="/rooms/create" hidden>
      <input name="name" placeholder="Название группы" required autocomplete="off">
      <input name="members" placeholder="Участники через запятую" autocomplete="off">
      <button class="primary">Создать группу</button>
    </form>
    <button class="close">Закрыть</button>
  </div>
</div>

<div id="setModal" class="overlay" hidden>
  <div class="card">
    <b>Настройки</b>
    <label class="row"><input type="checkbox" id="soundOpt"> Звук новых сообщений</label>
    <div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">Тема оформления</div>
      <div class="themes" id="themes">
        <div class="theme-opt" data-theme="black"><div class="swatch black"></div>Чёрная</div>
        <div class="theme-opt" data-theme="light"><div class="swatch light"></div>Светлая</div>
        <div class="theme-opt" data-theme="gray"><div class="swatch gray"></div>Серая</div>
        <div class="theme-opt" data-theme="blue"><div class="swatch blue"></div>Синяя</div>
      </div>
    </div>
    <button class="close">Закрыть</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const ME = {{ username|tojson }};
const rooms = {{ rooms|tojson }};
const personal = {{ personal|tojson }};
const FLASHES = {{ get_flashed_messages()|tojson }};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isGroup = k => typeof k === "string" && k.startsWith("room:");

let current = null, oldestId = null, hasMore = false, loading = false;
let editingId = null, typingText = "", typingTimer = null, lastTyping = 0;
let sound = true;
let theme = "black";
const unread = {}, online = new Set();
try { sound = localStorage.getItem("sound") !== "0"; } catch (e) {}
try { theme = localStorage.getItem("theme") || "black"; } catch (e) {}

const socket = io();

/* ---------- тема ---------- */
function applyTheme(name){
  theme = name;
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("theme", name); } catch (e) {}
  document.querySelectorAll("#themes .theme-opt").forEach(el => {
    el.classList.toggle("on", el.dataset.theme === name);
  });
}

/* ---------- сессия / выход ---------- */
function authLost(res) {
  if (res.redirected && res.url.includes("/login")) { location.href = "/login"; return true; }
  return false;
}
$("#logout").addEventListener("click", e => {
  e.preventDefault();
  try { socket.disconnect(); } catch (err) {}
  location.href = "/logout";
});
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

/* ---------- утилиты ---------- */
function toast(t) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3500);
}
function beep() {
  if (!sound) return;
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 660; g.gain.value = 0.05;
    o.start(); o.stop(a.currentTime + 0.12);
  } catch (e) {}
}
function chatKeyOf(m) {
  if (isGroup(m.recipient)) return m.recipient;
  return m.username === ME ? m.recipient : m.username;
}

/* ---------- боковая панель ---------- */
function item(key, name, isP) {
  const n = unread[key] || 0;
  return `<div class="item${key === current ? " on" : ""}" data-key="${esc(key)}">` +
    (isP ? `<i class="dot ${online.has(key) ? "on" : ""}"></i>` : `<span class="hash">#</span>`) +
    `<span class="name">${esc(name)}</span>` + (n ? `<em class="badge">${n}</em>` : "") +
    (isP ? `<button class="x" data-del="${esc(key)}" title="Удалить чат">✕</button>` : "") + `</div>`;
}
function renderSidebar() {
  $("#groups").innerHTML = rooms.map(r => item("room:" + r.id, r.name, false)).join("") || '<div class="empty">Нет групп</div>';
  $("#personal").innerHTML = personal.map(p => item(p, p, true)).join("") || '<div class="empty">Нет чатов</div>';
}
$("#lists").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); deleteChat(del.dataset.del); return; }
  const it = e.target.closest(".item");
  if (it) openChat(it.dataset.key);
});
async function deleteChat(peer) {
  if (!confirm("Удалить чат с " + peer + " из списка?")) return;
  const res = await fetch("/api/delete_chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ peer }) });
  if (authLost(res)) return;
  const i = personal.indexOf(peer); if (i >= 0) personal.splice(i, 1);
  if (current === peer) closeChat();
  renderSidebar();
}

/* ---------- заголовок ---------- */
function updateSub() {
  let t = typingText;
  if (!t && current && !isGroup(current)) t = online.has(current) ? "в сети" : "не в сети";
  $("#sub").textContent = t;
}
function closeChat() {
  current = null; cancelEdit(true);
  $("#title").textContent = "Выберите чат"; $("#sub").textContent = "";
  $("#messages").innerHTML = ""; $("#text").disabled = $("#send").disabled = true;
  document.body.classList.remove("chat-open");
}
$("#back").addEventListener("click", () => { closeChat(); renderSidebar(); });

/* ---------- сообщения ---------- */
function fileHtml(path) {
  const name = path.split("/").pop().replace(/^\d{20}_/, "");
  const ext = (name.split(".").pop() || "").toLowerCase();
  const src = esc(path);
  if (/^voice\.(webm|ogg|mp4)$/i.test(name)) return `<audio controls src="${src}"></audio>`;
  if (["png", "jpg", "jpeg", "gif", "webp"].includes(ext)) return `<a href="${src}" target="_blank"><img src="${src}" alt=""></a>`;
  if (["mp3", "wav", "ogg"].includes(ext)) return `<audio controls src="${src}"></audio>`;
  if (["mp4", "mov", "webm"].includes(ext)) return `<video controls src="${src}"></video>`;
  return `<a href="${src}" target="_blank" download>📄 ${esc(name)}</a>`;
}
function msgEl(m) {
  const mine = m.username === ME, grp = isGroup(m.recipient);
  const d = document.createElement("div");
  d.className = "msg " + (mine ? "mine" : "theirs"); d.dataset.id = m.id;
  d.innerHTML =
    (grp && !mine ? `<div class="author">${esc(m.username)}</div>` : "") +
    (m.file_path ? fileHtml(m.file_path) : "") +
    (m.text ? `<div class="text">${esc(m.text)}</div>` : "") +
    `<div class="meta"><span class="edited"></span>${esc(m.time || "")}` +
    (mine && !grp ? ` <span class="tick${m.read ? " read" : ""}">${m.read ? "✓✓" : "✓"}</span>` : "") + `</div>` +
    (mine ? `<div class="actions">${m.text ? '<button data-a="edit" title="Изменить">✎</button>' : ""}<button data-a="del" title="Удалить">🗑</button></div>` : "");
  return d;
}
async function loadMessages(before) {
  if (loading || !current) return;
  loading = true; const key = current;
  try {
    const res = await fetch("/api/messages?with=" + encodeURIComponent(key) + (before ? "&before_id=" + before : ""));
    if (authLost(res)) return;
    const data = await res.json();
    if (key !== current) return;
    if (!res.ok) { toast(data.error || "Ошибка загрузки"); return; }
    const box = $("#messages"), prevH = box.scrollHeight;
    const frag = document.createDocumentFragment();
    data.messages.forEach(m => frag.appendChild(msgEl(m)));
    box.prepend(frag);
    hasMore = data.has_more;
    if (data.messages.length) oldestId = data.messages[0].id;
    box.scrollTop = before ? box.scrollHeight - prevH : box.scrollHeight;
    if (!box.children.length) box.innerHTML = '<div class="hint">Сообщений пока нет</div>';
  } catch (e) { toast("Не удалось загрузить сообщения"); }
  finally { loading = false; }
}
async function openChat(key) {
  current = key; unread[key] = 0; typingText = ""; cancelEdit(true); renderSidebar();
  document.body.classList.add("chat-open");
  const room = rooms.find(r => "room:" + r.id === key);
  $("#title").textContent = isGroup(key) ? (room ? room.name : key) : key;
  updateSub();
  $("#text").disabled = $("#send").disabled = false;
  $("#messages").innerHTML = ""; hasMore = false; oldestId = null;
  await loadMessages(null);
  if (!isGroup(key)) socket.emit("mark_read", { peer: key });
  if (matchMedia("(min-width:701px)").matches) $("#text").focus();
}
$("#messages").addEventListener("scroll", e => {
  if (e.target.scrollTop < 40 && hasMore && !loading && oldestId) loadMessages(oldestId);
});
$("#messages").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const el = b.closest(".msg"), id = Number(el.dataset.id);
  if (b.dataset.a === "del") { if (confirm("Удалить сообщение?")) socket.emit("delete_message", { id }); }
  else {
    editingId = id; $("#editbar").hidden = false;
    $("#text").value = el.querySelector(".text")?.textContent || ""; $("#text").focus();
  }
});

/* ---------- отправка ---------- */
function cancelEdit(clear) {
  editingId = null; $("#editbar").hidden = true;
  if (clear) $("#text").value = "";
}
$("#cancelEdit").addEventListener("click", () => cancelEdit(true));
function sendMsg() {
  const t = $("#text").value.trim();
  if (!t || !current) return;
  if (editingId) socket.emit("edit_message", { id: editingId, text: t });
  else socket.emit("message", { recipient: current, text: t });
  cancelEdit(true);
}
$("#send").addEventListener("click", sendMsg);
$("#text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
$("#text").addEventListener("input", () => {
  if (!current || Date.now() - lastTyping < 2000) return;
  lastTyping = Date.now(); socket.emit("typing", { recipient: current });
});

async function upload(file, recipient) {
  const fd = new FormData(); fd.append("file", file); fd.append("recipient", recipient);
  try {
    const res = await fetch("/upload", { method: "POST", body: fd });
    if (authLost(res)) return;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) toast(data.error || "Ошибка загрузки файла");
  } catch (e) { toast("Не удалось отправить файл"); }
}
$("#attachBtn").addEventListener("click", () => { if (current) $("#file").click(); else toast("Сначала выберите чат"); });
$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (f && current) upload(f, current);
});

let rec = null, recChunks = [], recTarget = null;
$("#micBtn").addEventListener("click", async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (!current) { toast("Сначала выберите чат"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); recChunks = []; recTarget = current;
    rec.ondataavailable = e => recChunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); $("#micBtn").classList.remove("rec");
      const type = rec.mimeType || "audio/webm";
      const ext = type.includes("ogg") ? "ogg" : type.includes("mp4") ? "mp4" : "webm";
      const blob = new Blob(recChunks, { type });
      if (blob.size) upload(new File([blob], "voice." + ext, { type }), recTarget);
    };
    rec.start(); $("#micBtn").classList.add("rec");
  } catch (e) { toast("Нет доступа к микрофону (нужен https или localhost)"); }
});

/* ---------- Socket.IO ---------- */
let wasConnected = false;
socket.on("connect", () => {
  $("#meDot").classList.add("on");
  if (wasConnected && current) { $("#messages").innerHTML = ""; loadMessages(null); }
  wasConnected = true;
});
socket.on("disconnect", () => $("#meDot").classList.remove("on"));
socket.on("connect_error", async () => {
  try { authLost(await fetch("/api/user_exists?name=x")); } catch (e) {}
});

socket.on("online_users", d => { online.clear(); d.users.forEach(u => online.add(u)); renderSidebar(); updateSub(); });
socket.on("user_online", d => { online.add(d.username); renderSidebar(); updateSub(); });
socket.on("user_offline", d => { online.delete(d.username); renderSidebar(); updateSub(); });

socket.on("message", m => {
  const key = chatKeyOf(m);
  if (!isGroup(key) && !personal.includes(key)) {
    personal.push(key);
    fetch("/api/add_chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ peer: key }) });
  }
  if (key === current) {
    const box = $("#messages");
    box.querySelector(".hint")?.remove();
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120 || m.username === ME;
    box.appendChild(msgEl(m));
    if (atBottom) box.scrollTop = box.scrollHeight;
    if (m.username !== ME && !isGroup(key)) socket.emit("mark_read", { peer: key });
  } else if (m.username !== ME) {
    unread[key] = (unread[key] || 0) + 1; beep();
  }
  renderSidebar();
});
socket.on("message_edited", d => {
  const el = document.querySelector(`.msg[data-id="${d.id}"]`); if (!el) return;
  let t = el.querySelector(".text");
  if (!t) { t = document.createElement("div"); t.className = "text"; el.querySelector(".meta").before(t); }
  t.textContent = d.text; el.querySelector(".edited").textContent = "изм. ";
});
socket.on("message_deleted", d => document.querySelector(`.msg[data-id="${d.id}"]`)?.remove());
socket.on("messages_read", d => {
  if (d.reader !== current) return;
  document.querySelectorAll(".msg.mine .tick").forEach(t => { t.textContent = "✓✓"; t.classList.add("read"); });
});
socket.on("typing", d => {
  const key = isGroup(d.recipient) ? d.recipient : d.username;
  if (key !== current) return;
  typingText = (isGroup(key) ? d.username + " " : "") + "печатает…"; updateSub();
  clearTimeout(typingTimer); typingTimer = setTimeout(() => { typingText = ""; updateSub(); }, 3000);
});

/* ---------- модальные окна ---------- */
function show(id, v) { $(id).hidden = !v; }
$("#addBtn").addEventListener("click", () => { show("#addModal", true); $("#peer").focus(); });
$("#settingsBtn").addEventListener("click", () => {
  $("#soundOpt").checked = sound;
  applyTheme(theme);
  show("#setModal", true);
});
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => {
  if (e.target === o || e.target.classList.contains("close")) o.hidden = true;
}));
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#tab-p").hidden = b.dataset.tab !== "p"; $("#tab-g").hidden = b.dataset.tab !== "g";
}));
$("#soundOpt").addEventListener("change", e => {
  sound = e.target.checked;
  try { localStorage.setItem("sound", sound ? "1" : "0"); } catch (err) {}
});
$("#themes").addEventListener("click", e => {
  const opt = e.target.closest(".theme-opt");
  if (opt) applyTheme(opt.dataset.theme);
});
async function addPeer() {
  const peer = $("#peer").value.trim(); if (!peer) return;
  const res = await fetch("/api/add_chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ peer }) });
  if (authLost(res)) return;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || "Ошибка"); return; }
  if (!personal.includes(peer)) personal.push(peer);
  $("#peer").value = ""; show("#addModal", false); renderSidebar(); openChat(peer);
}
$("#addPeer").addEventListener("click", addPeer);
$("#peer").addEventListener("keydown", e => { if (e.key === "Enter") addPeer(); });

/* ---------- старт ---------- */
applyTheme(theme);
renderSidebar();
FLASHES.forEach(toast);
</script>
</body>
</html>
